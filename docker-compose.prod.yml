# VPS: app + Caddy (TLS). Postgres + Qdrant stay external (managed).
#
#   cp .env.example .env   # set DOMAIN, secrets, DATABASE_URL, QDRANT_*
#   docker compose -f docker-compose.prod.yml up --build -d

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY}
    image: knowledge-workbench:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads_data:/app/uploads
    expose:
      - "3000"

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  uploads_data:
  caddy_data:
  caddy_config:
